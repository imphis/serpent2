<!DOCTYPE html>
<html lang="en">
<head>
    <title>Serpent</title>
    <link rel="icon" type="image/x-icon" href="images/favicons/favicon.ico?v=7">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicons/16x16.png?v=7">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicons/32x32.png?v=7">
    <link rel="icon" type="image/png" sizes="48x48" href="images/favicons/48x48.png?v=7">
    <link rel="apple-touch-icon" sizes="180x180" href="images/favicons/appletouchicon.png?v=7">
    <link rel="icon" type="image/png" sizes="512x512" href="images/favicons/512x512.png?v=7">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/mainstyles.css?v=5">
    <link rel="stylesheet" href="css/herostyles.css?v=5">
    <link rel="stylesheet" href="css/navstyles.css?v=5">
    <link rel="stylesheet" href="css/buttonstyles.css?v=5">
    <link rel="stylesheet" href="css/headlinestyles.css?v=5">
    <link rel="stylesheet" href="css/substyles.css?v=5">
    <link rel="stylesheet" href="css/iconstyles.css?v=5">
    <link rel="stylesheet" href="css/logostyles.css?v=5">
    <link rel="stylesheet" href="css/paymentstyles.css?v=5">
    <link rel="stylesheet" href="css/serpentstyles.css?v=6">
    <link rel="stylesheet" href="css/resellerstyles.css?v=5">
</head>
    <body>
        <canvas id="rainfield"></canvas>

        <nav>
            <div class="navlinks">
                <a href="#home" class="active" id="navhome">Home</a>
                <a href="#resellers" id="navresellers">Resellers</a>
                <span class="navunderline" id="navunderline"></span>
            </div>
        </nav>

        <section class="view isactive viewhome" id="viewhome">
            <div class="main">
                <h1 class="serpenttitle">Serpent</h1>

                <button class="download" id="downloadbtn" type="button">
                    <img src="images/download.png" alt="">
                    Download
                </button>
            </div>

            <a class="discord" href="https://discord.gg/KbyJ256tZU" target="_blank" rel="noopener noreferrer">
                <img src="images/discord.png" alt="">
            </a>
        </section>

        <section class="view viewresellers" id="viewresellers">
            <div class="hero">
                <h1 class="headline">
                    Our Resellers
                </h1>

                <p class="subcopy">
                    Purchase Serpent through one of our official resellers below.
                </p>

                <div class="resellerlist">
                    <a class="reselleritem" href="https://zwced.lol/serpent" target="_blank" rel="noopener noreferrer">
                        <img class="resellerimg" src="images/zwcedlol.png" alt="zwcedlol">
                        <span class="reselleraction">
                            <span class="resellerbuy">Buy</span>
                            <svg class="resellerarrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="7" y1="17" x2="17" y2="7"/>
                                <polyline points="7 7 17 7 17 17"/>
                            </svg>
                        </span>
                    </a>
                </div>
            </div>
        </section>

        <div class="overlay" id="downloadoverlay">
            <button class="overlayclose" id="downloadclose" type="button" aria-label="Close">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>

            <div class="overlaycontent">
                <h2>Choose your platform</h2>
                <div class="dlplatformchoices">
                    <button class="dlplatformchoice dlwindows" type="button" aria-label="Download for Windows">
                        <img src="images/windows.png" alt="">
                        <span class="visuallyhidden">Windows</span>
                    </button>

                    <button class="dlplatformchoice dlios" type="button" aria-label="Download for iOS">
                        <img src="images/apple.png" alt="">
                        <span class="visuallyhidden">iOS</span>
                    </button>

                    <button class="dlplatformchoice dlcs2" type="button" aria-label="Download for CS2">
                        <img src="images/cs2.png" alt="">
                        <span class="visuallyhidden">CS2</span>
                    </button>
                </div>
            </div>
        </div>

        <script src="js/nav.js?v=5"></script>
        <script src="js/background.js?v=5"></script>
        <script src="js/payments.js?v=5"></script>
        <script src="js/tabs.js?v=5"></script>
    </body>
</html>
